services:
  api:
    build: .
    image: soundcloud-streaming-backend:local
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID:-}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET:-}
      SOUNDCLOUD_REDIRECT_URI: ${SOUNDCLOUD_REDIRECT_URI:-http://localhost:8080/api/auth/soundcloud/callback}
