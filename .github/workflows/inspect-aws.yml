name: inspect-aws-deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: List ECS services
        shell: bash
        run: |
          set -euo pipefail
          service_arns=$(aws ecs list-services \
            --cluster default \
            --query 'serviceArns[]' \
            --output text)
          for service_arn in $service_arns; do
            aws ecs describe-express-gateway-service \
              --service-arn "$service_arn" \
              --query 'service.{cluster:cluster,serviceName:serviceName,serviceArn:serviceArn,status:status.statusCode,infrastructureRoleArn:infrastructureRoleArn,endpoint:activeConfigurations[0].ingressPaths[0].endpoint}' \
              --output json
          done
