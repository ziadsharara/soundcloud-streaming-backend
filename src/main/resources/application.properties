spring.application.name=soundstream
server.port=${PORT:8080}

# Return error details (e.g. "Room not found") to the frontend
spring.mvc.problemdetails.enabled=true

# Origins allowed to call the API / open the WebSocket directly.
# The public site is kept separate so an older FRONTEND_ORIGINS deployment value
# cannot accidentally exclude guests who use the canonical invite URL.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173},${PUBLIC_FRONTEND_ORIGIN:https://soundstreaming.vercel.app}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
