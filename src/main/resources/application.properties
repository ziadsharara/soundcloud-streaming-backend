spring.application.name=soundstream
server.port=${PORT:8080}

# Return error details (e.g. "Room not found") to the frontend
spring.mvc.problemdetails.enabled=true

# Origins allowed to call the API / open the WebSocket directly.
# The public site is kept separate so an older FRONTEND_ORIGINS deployment value
# cannot accidentally exclude guests who use the canonical invite URL.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173},${PUBLIC_FRONTEND_ORIGIN:https://soundstreaming.vercel.app}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# A room ends when its host ends it, not when it goes quiet: people leaving, or the
# host closing the tab, never close a room. This is only the safety net that stops a
# long-lived server holding rooms nobody will return to for ever.
app.rooms.empty-grace=${ROOM_EMPTY_GRACE:PT24H}
app.rooms.cleanup-interval=${ROOM_CLEANUP_INTERVAL:PT1M}

# Voice notes, video notes and files sent to a room. They live beside the room on disk,
# never in the heap, and are deleted when the room is.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
app.attachments.dir=${ATTACHMENT_DIR:}
