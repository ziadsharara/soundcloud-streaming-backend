spring.application.name=soundstream
server.port=${PORT:8080}

# Return error details (e.g. "Room not found") to the frontend
spring.mvc.problemdetails.enabled=true

# Origins allowed to call the API / open the WebSocket directly.
# Not needed in dev when going through the Vite proxy, but handy for deployments.
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# SoundCloud OAuth 2.1. Keep the secret in the environment, never in source control.
app.soundcloud.client-id=${SOUNDCLOUD_CLIENT_ID:}
app.soundcloud.client-secret=${SOUNDCLOUD_CLIENT_SECRET:}
app.soundcloud.redirect-uri=${SOUNDCLOUD_REDIRECT_URI:http://localhost:8080/api/auth/soundcloud/callback}
app.soundcloud.allowed-return-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
